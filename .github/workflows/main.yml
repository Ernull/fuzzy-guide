name: Build Tapsi Link Client APK (License Runner)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Studio Project Files
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/hyperlink/tapsi/client
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TapsiLinkClient"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.hyperlink.tapsi.client'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.hyperlink.tapsi.client"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B1120"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M54,20a22,22 0 1,0 0,44a22,22 0 1,0 0,-44zm0,10a12,12 0 1,1 0,24a12,12 0 1,1 0,-24z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M48,62h12v26h-12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Tapsi Link</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/hyperlink/tapsi/client/MainActivity.java
          package ir.hyperlink.tapsi.client;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final String API_GET_LICENSE =
                      "https://testtok-production12.up.railway.app/api/tapsi/get-license/";
              private static final String TAPSI_PROFILE_URL = "https://app.tapsi.cab/profile/";
              private static final String TAPSI_BOOTSTRAP_URL = "https://app.tapsi.cab/robots.txt";

              private static final String PREFS_NAME = "tapsi_link_client_prefs";
              private static final String KEY_SAVED_LICENSES = "saved_licenses";

              // پالت رنگی مدرن و یکدست
              private static final String COLOR_BG = "#0B1120";
              private static final String COLOR_SURFACE = "#131C2E";
              private static final String COLOR_CARD = "#1E293B";
              private static final String COLOR_BORDER = "#334155";
              private static final String COLOR_CYAN = "#38BDF8";
              private static final String COLOR_GREEN = "#10B981";
              private static final String COLOR_GOLD = "#F59E0B";
              private static final String COLOR_ERROR = "#F87171";
              private static final String COLOR_TEXT = "#F8FAFC";
              private static final String COLOR_MUTED = "#94A3B8";

              private static final String[] TARGET_DOMAINS = {
                      ".tapsi.cab",
                      ".tapsi.ir",
                      ".tapsi.markets",
                      ".tapsi.shop"
              };

              private static final Set<String> RESERVED_COOKIE_ATTRS = new HashSet<>(Arrays.asList(
                      "path", "domain", "expires", "max-age", "secure", "httponly", "samesite"
              ));

              private static final String[] CITY_NAMES = {
                      "تهران (میدان آزادی)",
                      "تهران (ونک / ولیعصر)",
                      "تهران (صادقیه / غرب)",
                      "تهران (تهرانپارس / شرق)",
                      "مشهد (مرکز شهر)",
                      "اصفهان (دروازه شیراز)",
                      "شیراز (میدان نمازی)",
                      "کرج (فلکه اول گوهردشت)",
                      "تبریز (آبرسان)"
              };
              private static final double[] CITY_LATS = {
                      35.6997, 35.7575, 35.7219, 35.7366, 36.2972, 32.6164, 29.6272, 35.8400, 38.0658
              };
              private static final double[] CITY_LNGS = {
                      51.3380, 51.4100, 51.3347, 51.5366, 59.6067, 51.6660, 52.5199, 50.9715, 46.3268
              };

              private SharedPreferences prefs;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              // Views: Screen 1 (Login)
              private FrameLayout rootContainer;
              private ScrollView loginScreen;
              private EditText licenseInput;
              private Button authBtn;
              private TextView loginStatusView;
              private LinearLayout recentSection;
              private LinearLayout recentListContainer;

              // Views: Screen 2 (Portal WebView)
              private LinearLayout portalScreen;
              private TextView portalStatusBadge;
              private ProgressBar progressBar;
              private WebView webView;

              // Active Session State
              private boolean isLoadingAuth = false;
              private boolean isPortalVisible = false;
              private boolean isBootstrappingStorage = false;
              private String activeLicenseKey = "";
              private String activeCookies = "";
              private String activeLocalStorage = "{}";

              private int selectedCityIndex = 0;
              private double fallbackLat = CITY_LATS[0];
              private double fallbackLng = CITY_LNGS[0];

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor(COLOR_BG));
                      getWindow().setNavigationBarColor(Color.parseColor(COLOR_BG));
                  }

                  prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  requestLocationPermissionsIfNeeded();

                  rootContainer = new FrameLayout(this);
                  rootContainer.setBackgroundColor(Color.parseColor(COLOR_BG));
                  rootContainer.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  buildLoginScreen();
                  buildPortalScreen();

                  rootContainer.addView(loginScreen);
                  rootContainer.addView(portalScreen);

                  portalScreen.setVisibility(View.GONE);
                  loginScreen.setVisibility(View.VISIBLE);

                  setContentView(rootContainer);
                  refreshRecentLicensesUI();
              }

              // =========================================================================
              // SCREEN 1: صفحه احراز هویت و انتخاب لایسنس (مرتب و مدرن)
              // =========================================================================
              private void buildLoginScreen() {
                  loginScreen = new ScrollView(this);
                  loginScreen.setFillViewport(true);
                  loginScreen.setBackgroundColor(Color.parseColor(COLOR_BG));
                  loginScreen.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER);
                  wrapper.setPadding(dp(20), dp(28), dp(20), dp(28));

                  // کارت مرکزی
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setGravity(Gravity.CENTER_HORIZONTAL);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(Color.parseColor(COLOR_SURFACE));
                  cardBg.setCornerRadius(dp(22));
                  cardBg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  card.setBackground(cardBg);
                  card.setPadding(dp(22), dp(28), dp(22), dp(24));
                  card.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  // آیکون دایره‌ای بالا
                  TextView iconBadge = new TextView(this);
                  iconBadge.setText("🚕");
                  iconBadge.setTextSize(TypedValue.COMPLEX_UNIT_SP, 30);
                  iconBadge.setGravity(Gravity.CENTER);
                  GradientDrawable iconBg = new GradientDrawable();
                  iconBg.setShape(GradientDrawable.OVAL);
                  iconBg.setColor(Color.parseColor("#162A45"));
                  iconBg.setStroke(dp(2), Color.parseColor(COLOR_CYAN));
                  iconBadge.setBackground(iconBg);
                  LinearLayout.LayoutParams iconLp = new LinearLayout.LayoutParams(dp(72), dp(72));
                  iconBadge.setLayoutParams(iconLp);
                  card.addView(iconBadge);

                  // عنوان
                  TextView titleView = new TextView(this);
                  titleView.setText("TAPSI LINK");
                  titleView.setTextColor(Color.parseColor(COLOR_TEXT));
                  titleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  titleView.setTypeface(Typeface.DEFAULT_BOLD);
                  titleView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleLp.setMargins(0, dp(16), 0, dp(4));
                  titleView.setLayoutParams(titleLp);
                  card.addView(titleView);

                  // زیرعنوان
                  TextView subView = new TextView(this);
                  subView.setText("کلید لایسنس تپسی را برای ورود مستقیم به حساب وارد کنید");
                  subView.setTextColor(Color.parseColor(COLOR_MUTED));
                  subView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  subView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams subLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  subLp.setMargins(0, 0, 0, dp(22));
                  subView.setLayoutParams(subLp);
                  card.addView(subView);

                  // کادر ورود لایسنس + دکمه چسباندن
                  LinearLayout inputRow = new LinearLayout(this);
                  inputRow.setOrientation(LinearLayout.HORIZONTAL);
                  inputRow.setGravity(Gravity.CENTER_VERTICAL);
                  GradientDrawable inputRowBg = new GradientDrawable();
                  inputRowBg.setColor(Color.parseColor(COLOR_BG));
                  inputRowBg.setCornerRadius(dp(14));
                  inputRowBg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  inputRow.setBackground(inputRowBg);
                  inputRow.setPadding(dp(10), dp(4), dp(10), dp(4));
                  inputRow.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(52)));

                  licenseInput = new EditText(this);
                  licenseInput.setHint("TAPSI-XXXX-XXXX");
                  licenseInput.setHintTextColor(Color.parseColor("#475569"));
                  licenseInput.setTextColor(Color.parseColor(COLOR_TEXT));
                  licenseInput.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  licenseInput.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  licenseInput.setSingleLine(true);
                  licenseInput.setBackgroundColor(Color.TRANSPARENT);
                  licenseInput.setInputType(InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS | InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS);
                  licenseInput.setGravity(Gravity.CENTER_VERTICAL | Gravity.LEFT);
                  licenseInput.setLayoutParams(new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.MATCH_PARENT, 1f));

                  Button pasteBtn = createPillButton("📋 چسباندن", COLOR_CARD, COLOR_CYAN, COLOR_BORDER);
                  LinearLayout.LayoutParams pasteLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, dp(34));
                  pasteLp.setMargins(0, 0, dp(6), 0);
                  pasteBtn.setLayoutParams(pasteLp);
                  pasteBtn.setOnClickListener(v -> pasteFromClipboard());

                  inputRow.addView(licenseInput);
                  inputRow.addView(pasteBtn);
                  card.addView(inputRow);

                  // پیام وضعیت / خطا
                  loginStatusView = new TextView(this);
                  loginStatusView.setVisibility(View.GONE);
                  loginStatusView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  loginStatusView.setGravity(Gravity.CENTER);
                  loginStatusView.setPadding(dp(10), dp(8), dp(10), dp(8));
                  LinearLayout.LayoutParams stLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  stLp.setMargins(0, dp(12), 0, 0);
                  loginStatusView.setLayoutParams(stLp);
                  card.addView(loginStatusView);

                  // دکمه اصلی ورود
                  authBtn = createMainButton("🔓 ورود و اجرای لایسنس", COLOR_CYAN, "#0B1120", null);
                  LinearLayout.LayoutParams btnLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(50));
                  btnLp.setMargins(0, dp(18), 0, 0);
                  authBtn.setLayoutParams(btnLp);
