              // =========================================================================
              // SCREEN 2: مرورگر اختصاصی اجرای نشست تپسی و سوپرمارکت
              // =========================================================================
              @SuppressLint("SetJavaScriptEnabled")
              private void buildPortalScreen() {
                  portalScreen = new LinearLayout(this);
                  portalScreen.setOrientation(LinearLayout.VERTICAL);
                  portalScreen.setBackgroundColor(Color.parseColor(COLOR_BG));
                  portalScreen.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // هدر مرتب و جمع‌وجور بالا
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setBackgroundColor(Color.parseColor(COLOR_SURFACE));
                  topBar.setPadding(dp(10), dp(7), dp(10), dp(7));

                  TextView brand = new TextView(this);
                  brand.setText("🚕 Tapsi Link");
                  brand.setTextColor(Color.parseColor(COLOR_CYAN));
                  brand.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  brand.setTypeface(Typeface.DEFAULT_BOLD);

                  portalStatusBadge = new TextView(this);
                  portalStatusBadge.setText("تهران");
                  portalStatusBadge.setTextColor(Color.parseColor(COLOR_MUTED));
                  portalStatusBadge.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);
                  portalStatusBadge.setSingleLine(true);
                  portalStatusBadge.setEllipsize(TextUtils.TruncateAt.END);
                  GradientDrawable stBg = new GradientDrawable();
                  stBg.setColor(Color.parseColor(COLOR_CARD));
                  stBg.setCornerRadius(dp(8));
                  portalStatusBadge.setBackground(stBg);
                  portalStatusBadge.setPadding(dp(8), dp(3), dp(8), dp(3));
                  LinearLayout.LayoutParams stLp = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  stLp.setMargins(dp(8), 0, dp(8), 0);
                  portalStatusBadge.setLayoutParams(stLp);

                  Button cityBtn = createPillButton("📍 شهر", COLOR_CARD, COLOR_GREEN, COLOR_BORDER);
                  cityBtn.setOnClickListener(v -> showLocationPickerDialog());

                  Button syncBtn = createPillButton("🔄 همگام", COLOR_CARD, COLOR_GOLD, COLOR_BORDER);
                  LinearLayout.LayoutParams syLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  syLp.setMargins(dp(5), 0, 0, 0);
                  syncBtn.setLayoutParams(syLp);
                  syncBtn.setOnClickListener(v -> forceSyncCurrentAccount());

                  Button reloadBtn = createPillButton("↻", COLOR_CARD, COLOR_TEXT, COLOR_BORDER);
                  LinearLayout.LayoutParams reLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  reLp.setMargins(dp(5), 0, 0, 0);
                  reloadBtn.setLayoutParams(reLp);
                  reloadBtn.setOnClickListener(v -> {
                      if (webView != null) webView.reload();
                  });

                  Button exitBtn = createPillButton("🚪 خروج", "#2D1219", COLOR_ERROR, COLOR_ERROR);
                  LinearLayout.LayoutParams exLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  exLp.setMargins(dp(5), 0, 0, 0);
                  exitBtn.setLayoutParams(exLp);
                  exitBtn.setOnClickListener(v -> confirmAndResetSession());

                  topBar.addView(brand);
                  topBar.addView(portalStatusBadge);
                  topBar.addView(cityBtn);
                  topBar.addView(syncBtn);
                  topBar.addView(reloadBtn);
                  topBar.addView(exitBtn);
                  portalScreen.addView(topBar);

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(2)));
                  portalScreen.addView(progressBar);

                  webView = new WebView(this);
                  webView.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setupWebView();
                  portalScreen.addView(webView);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(false);
                  // دقیقاً مطابق منطق main.dart برای باز شدن بومی SSO تپسی مارکت بدون از دست رفتن Referer
                  settings.setSupportMultipleWindows(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                  );

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cm.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, true);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          if (!isBootstrappingStorage && url != null && url.startsWith("http")) {
                              view.evaluateJavascript(buildRuntimeInjectionScript(), null);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          CookieManager.getInstance().flush();

                          if (isBootstrappingStorage && url != null && url.contains("app.tapsi.cab")) {
                              isBootstrappingStorage = false;
                              view.evaluateJavascript(buildCabLocalStorageBootstrapScript(), value -> {
                                  view.loadUrl(TAPSI_PROFILE_URL);
                              });
                              return;
                          }

                          if (url != null && url.startsWith("http")) {
                              view.evaluateJavascript(buildRuntimeInjectionScript(), null);
                          }
                      }
                  });
              }

              // =========================================================================
              // احراز هویت لایسنس و تزریق نشست تپسی + سوپرمارکت
              // =========================================================================
              private void authenticateLicense(String overrideKey) {
                  if (isLoadingAuth) return;

                  String rawKey = (overrideKey != null ? overrideKey : licenseInput.getText().toString())
                          .trim()
                          .replaceAll("\\s+", "");

                  if (rawKey.isEmpty()) {
                      showLoginStatus("⚠️ لطفاً کلید لایسنس معتبر وارد کنید.", COLOR_ERROR);
                      return;
                  }

                  isLoadingAuth = true;
                  authBtn.setEnabled(false);
                  authBtn.setText("⏳ در حال احراز هویت...");
                  showLoginStatus("🔄 در حال پاک‌سازی نشست قبلی و دریافت اطلاعات لایسنس...", COLOR_CYAN);

                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(API_GET_LICENSE + Uri.encode(rawKey));
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(20000);
                          conn.setReadTimeout(20000);
                          conn.setRequestProperty("Accept", "application/json");

                          int httpCode = conn.getResponseCode();
                          InputStream is = (httpCode >= 200 && httpCode < 400) ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder sb = new StringBuilder();
                          if (is != null) {
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) sb.append(line);
                              }
                          }

                          JSONObject body = new JSONObject(sb.toString());
                          boolean success = (httpCode == 200) && body.optBoolean("success", false);

                          if (success) {
                              JSONObject dataObj = body.optJSONObject("data");
                              if (dataObj == null) dataObj = new JSONObject();

                              // استخراج ایمن کوکی‌ها (چه رشته باشد چه آبجکت JSON)
                              String cookiesStr = "";
                              Object rawCookies = dataObj.opt("cookies");
                              if (rawCookies instanceof String) {
                                  cookiesStr = (String) rawCookies;
                              } else if (rawCookies instanceof JSONObject) {
                                  JSONObject cObj = (JSONObject) rawCookies;
                                  StringBuilder csb = new StringBuilder();
                                  Iterator<String> keys = cObj.keys();
                                  while (keys.hasNext()) {
                                      String k = keys.next();
                                      if (csb.length() > 0) csb.append("; ");
                                      csb.append(k).append("=").append(cObj.optString(k, ""));
                                  }
                                  cookiesStr = csb.toString();
                              }

                              // استخراج ایمن LocalStorage
                              String lsStr = "{}";
                              Object rawLs = dataObj.opt("local_storage");
                              if (rawLs instanceof String && !((String) rawLs).trim().isEmpty()) {
                                  lsStr = (String) rawLs;
                              } else if (rawLs instanceof JSONObject) {
                                  lsStr = rawLs.toString();
                              }

                              final String finalCookies = cookiesStr;
                              final String finalLs = lsStr;

                              mainHandler.post(() -> {
                                  isLoadingAuth = false;
                                  authBtn.setEnabled(true);
                                  authBtn.setText("🔓 ورود و اجرای لایسنس");

                                  activeLicenseKey = rawKey;
                                  activeCookies = finalCookies;
                                  activeLocalStorage = finalLs;

                                  saveLicenseToHistory(rawKey);
                                  refreshRecentLicensesUI();
                                  showLoginStatus("✅ دسترسی تایید شد؛ در حال باز کردن پورتال تپسی...", COLOR_GREEN);

                                  startPortalSession();
                              });
                          } else {
                              String errMsg = body.optString("detail",
                                      body.optString("message", "لایسنس نامعتبر است یا یافت نشد."));
                              mainHandler.post(() -> {
                                  isLoadingAuth = false;
                                  authBtn.setEnabled(true);
                                  authBtn.setText("🔓 ورود و اجرای لایسنس");
                                  showLoginStatus("❌ " + errMsg, COLOR_ERROR);
                              });
                          }

                      } catch (Exception e) {
                          mainHandler.post(() -> {
                              isLoadingAuth = false;
                              authBtn.setEnabled(true);
                              authBtn.setText("🔓 ورود و اجرای لایسنس");
                              showLoginStatus("❌ خطا در ارتباط با سرور. اتصال اینترنت را بررسی کنید.", COLOR_ERROR);
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void startPortalSession() {
                  deepCleanAllWebData(() -> {
                      injectCookiesForAllDomains(activeCookies);
                      portalStatusBadge.setText(CITY_NAMES[selectedCityIndex]);
                      loginScreen.setVisibility(View.GONE);
                      portalScreen.setVisibility(View.VISIBLE);
                      isPortalVisible = true;

                      // تزریق LocalStorage روی دامنه app.tapsi.cab پیش از لود صفحه پروفایل
                      isBootstrappingStorage = true;
                      webView.loadUrl(TAPSI_BOOTSTRAP_URL);
                  });
              }

              private void forceSyncCurrentAccount() {
                  Toast.makeText(this, "🔄 در حال پاک‌سازی کش و همگام‌سازی مجدد اکانت...", Toast.LENGTH_SHORT).show();
                  deepCleanAllWebData(() -> {
                      injectCookiesForAllDomains(activeCookies);
                      isBootstrappingStorage = true;
                      webView.loadUrl(TAPSI_BOOTSTRAP_URL);
                  });
              }

              private void deepCleanAllWebData(final Runnable onDone) {
                  try {
                      if (webView != null) {
                          webView.evaluateJavascript(
                                  "(function(){"
                                          + "try{window.localStorage.clear();}catch(e){}"
                                          + "try{window.sessionStorage.clear();}catch(e){}"
                                          + "try{if(window.indexedDB&&window.indexedDB.databases){window.indexedDB.databases().then(function(dbs){dbs.forEach(function(db){if(db&&db.name)window.indexedDB.deleteDatabase(db.name);});});}}catch(e){}"
                                          + "try{if('caches' in window){caches.keys().then(function(n){for(var i=0;i<n.length;i++)caches.delete(n[i]);});}}catch(e){}"
                                          + "})();",
                                  null
                          );
                          webView.clearCache(true);
                          webView.clearFormData();
                          webView.clearHistory();
                      }
                      WebStorage.getInstance().deleteAllData();

                      CookieManager cm = CookieManager.getInstance();
                      cm.removeAllCookies(value -> {
                          cm.flush();
                          if (onDone != null) mainHandler.post(onDone);
                      });
                  } catch (Exception e) {
                      if (onDone != null) mainHandler.post(onDone);
                  }
              }

              private void injectCookiesForAllDomains(String cookiesStr) {
                  if (cookiesStr == null || cookiesStr.trim().isEmpty() || "empty".equalsIgnoreCase(cookiesStr.trim())) {
                      return;
                  }
                  CookieManager cm = CookieManager.getInstance();
                  String[] parts = cookiesStr.split(";");

                  for (String domain : TARGET_DOMAINS) {
                      String host = domain.startsWith(".") ? domain.substring(1) : domain;
                      String baseUrl = "https://" + host;
                      for (String part : parts) {
                          String trimmed = part.trim();
                          if (trimmed.isEmpty()) continue;
                          int eqIdx = trimmed.indexOf('=');
                          if (eqIdx <= 0) continue;

                          String name = trimmed.substring(0, eqIdx).trim();
                          String value = trimmed.substring(eqIdx + 1).trim();
                          if (RESERVED_COOKIE_ATTRS.contains(name.toLowerCase())) continue;

                          String cookieHeader = name + "=" + value + "; Domain=" + domain + "; Path=/; Secure";
                          cm.setCookie(baseUrl, cookieHeader);
                      }
                  }
                  cm.flush();
              }

              /**
               * تزریق LocalStorage اکانت روی app.tapsi.cab پیش از اجرای اپلیکیشن اصلی
               */
              private String buildCabLocalStorageBootstrapScript() {
                  String safeJson = JSONObject.quote(activeLocalStorage != null ? activeLocalStorage : "{}");
                  String safeLic = JSONObject.quote(activeLicenseKey);
                  return "(function(){"
                          + "try{"
                          + "window.localStorage.clear();"
                          + "window.sessionStorage.setItem('__tapsi_cab_init_'+" + safeLic + ",'1');"
                          + "var data=JSON.parse(" + safeJson + ");"
                          + "if(data&&typeof data==='object'){"
                          + "for(var k in data){if(Object.prototype.hasOwnProperty.call(data,k)){"
                          + "window.localStorage.setItem(k,typeof data[k]==='string'?data[k]:JSON.stringify(data[k]));"
                          + "}}"
                          + "}"
                          + "}catch(e){}"
                          + "})();";
              }

              /**
               * اسکریپت زمان اجرا:
               * 1. روی tapsi.markets فقط یک بار LocalStorage قبلی را پاک می‌کند تا SSO بدون تداخل اجرا شود.
               * 2. Fallback موقعیت مکانی (GPS) را تزریق می‌کند تا دکمه «موقعیت من» روی نقشه معطل نماند.
               */
              private String buildRuntimeInjectionScript() {
                  String safeLic = JSONObject.quote(activeLicenseKey);
                  return "(function(){"
                          + "try{"
                          + "var host=window.location.hostname||'';"
                          + "var lic=" + safeLic + ";"
                          + "if(host.indexOf('tapsi.markets')!==-1||host.indexOf('tapsi.shop')!==-1){"
                          + "var mk='__tapsi_market_init_'+lic;"
                          + "if(window.sessionStorage.getItem(mk)!=='1'){"
                          + "window.localStorage.clear();"
                          + "window.sessionStorage.setItem(mk,'1');"
                          + "}"
                          + "}"
                          + "}catch(e){}"
                          + "try{"
                          + "window.__tapsiFallbackLat=" + fallbackLat + ";"
                          + "window.__tapsiFallbackLng=" + fallbackLng + ";"
                          + "if(navigator.geolocation&&!navigator.geolocation.__tapsiPatched){"
                          + "var orig=navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);"
                          + "navigator.geolocation.__tapsiPatched=true;"
                          + "navigator.geolocation.getCurrentPosition=function(success,error,options){"
                          + "var resolved=false;"
                          + "var timer=setTimeout(function(){"
                          + "if(!resolved&&success){resolved=true;success({coords:{latitude:window.__tapsiFallbackLat,longitude:window.__tapsiFallbackLng,accuracy:15,altitude:null,altitudeAccuracy:null,heading:null,speed:null},timestamp:Date.now()});}"
                          + "},2500);"
                          + "orig(function(pos){if(!resolved){resolved=true;clearTimeout(timer);if(success)success(pos);}},"
                          + "function(err){if(!resolved){resolved=true;clearTimeout(timer);if(success){success({coords:{latitude:window.__tapsiFallbackLat,longitude:window.__tapsiFallbackLng,accuracy:15,altitude:null,altitudeAccuracy:null,heading:null,speed:null},timestamp:Date.now()});}else if(error){error(err);}}},"
                          + "{enableHighAccuracy:true,timeout:2200,maximumAge:0});"
                          + "};"
                          + "}"
                          + "}catch(e){}"
                          + "})();";
              }

              // =========================================================================
              // انتخاب شهر نقشه و خروج از نشست
              // =========================================================================
              private void showLocationPickerDialog() {
                  new AlertDialog.Builder(this)
                          .setTitle("📍 انتخاب شهر پیش‌فرض نقشه")
                          .setSingleChoiceItems(CITY_NAMES, selectedCityIndex, (dialog, which) -> {
                              selectedCityIndex = which;
                              fallbackLat = CITY_LATS[which];
                              fallbackLng = CITY_LNGS[which];
                              portalStatusBadge.setText(CITY_NAMES[which]);
                              if (webView != null) {
                                  webView.evaluateJavascript(
                                          "window.__tapsiFallbackLat=" + fallbackLat + ";window.__tapsiFallbackLng=" + fallbackLng + ";",
                                          null
                                  );
                              }
                              Toast.makeText(this, "موقعیت روی «" + CITY_NAMES[which] + "» تنظیم شد", Toast.LENGTH_SHORT).show();
                              dialog.dismiss();
                          })
                          .setNegativeButton("بستن", null)
                          .show();
              }

              private void confirmAndResetSession() {
                  new AlertDialog.Builder(this)
                          .setTitle("🚪 خروج و پاک‌سازی نشست")
                          .setMessage("تمامی کوکی‌ها و اطلاعات حساب فعلی تپسی و سوپرمارکت پاک شده و به صفحه ورود لایسنس بازمی‌گردید. ادامه می‌دهید؟")
                          .setPositiveButton("بله، خروج", (d, w) -> {
                              deepCleanAllWebData(() -> {
                                  isPortalVisible = false;
                                  portalScreen.setVisibility(View.GONE);
                                  loginScreen.setVisibility(View.VISIBLE);
                                  loginStatusView.setVisibility(View.GONE);
                                  webView.loadUrl("about:blank");
                                  Toast.makeText(this, "✅ نشست با موفقیت پاک‌سازی شد", Toast.LENGTH_SHORT).show();
                              });
                          })
                          .setNegativeButton("انصراف", null)
                          .show();
              }

              // =========================================================================
              // مدیریت تاریخچه لایسنس‌های اخیر و ابزارهای کمکی
              // =========================================================================
              private void saveLicenseToHistory(String key) {
                  try {
                      JSONArray arr = new JSONArray(prefs.getString(KEY_SAVED_LICENSES, "[]"));
                      JSONArray updated = new JSONArray();
                      updated.put(key);
                      for (int i = 0; i < arr.length() && updated.length() < 10; i++) {
                          String existing = arr.optString(i, "");
                          if (!existing.isEmpty() && !existing.equalsIgnoreCase(key)) {
                              updated.put(existing);
                          }
                      }
                      prefs.edit().putString(KEY_SAVED_LICENSES, updated.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              private void removeLicenseFromHistory(String key) {
                  try {
                      JSONArray arr = new JSONArray(prefs.getString(KEY_SAVED_LICENSES, "[]"));
                      JSONArray updated = new JSONArray();
                      for (int i = 0; i < arr.length(); i++) {
                          String existing = arr.optString(i, "");
                          if (!existing.isEmpty() && !existing.equalsIgnoreCase(key)) {
                              updated.put(existing);
                          }
                      }
                      prefs.edit().putString(KEY_SAVED_LICENSES, updated.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              private void refreshRecentLicensesUI() {
                  recentListContainer.removeAllViews();
                  try {
                      JSONArray arr = new JSONArray(prefs.getString(KEY_SAVED_LICENSES, "[]"));
                      if (arr.length() == 0) {
                          recentSection.setVisibility(View.GONE);
                          return;
                      }
                      recentSection.setVisibility(View.VISIBLE);

                      for (int i = 0; i < arr.length(); i++) {
                          final String key = arr.optString(i, "");
                          if (key.isEmpty()) continue;

                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          GradientDrawable rowBg = new GradientDrawable();
                          rowBg.setColor(Color.parseColor(COLOR_BG));
                          rowBg.setCornerRadius(dp(10));
                          rowBg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                          row.setBackground(rowBg);
                          row.setPadding(dp(12), dp(8), dp(10), dp(8));
                          LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                          rlp.setMargins(0, 0, 0, dp(6));
                          row.setLayoutParams(rlp);

                          TextView keyTv = new TextView(this);
                          keyTv.setText("🔑 " + key);
                          keyTv.setTextColor(Color.parseColor(COLOR_TEXT));
                          keyTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                          keyTv.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                          keyTv.setSingleLine(true);
                          keyTv.setEllipsize(TextUtils.TruncateAt.END);
                          keyTv.setLayoutParams(new LinearLayout.LayoutParams(
                                  0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                          keyTv.setOnClickListener(v -> {
                              licenseInput.setText(key);
                              authenticateLicense(key);
                          });

                          TextView delTv = new TextView(this);
                          delTv.setText("✕");
                          delTv.setTextColor(Color.parseColor(COLOR_MUTED));
                          delTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                          delTv.setPadding(dp(10), dp(2), dp(4), dp(2));
                          delTv.setOnClickListener(v -> {
                              removeLicenseFromHistory(key);
                              refreshRecentLicensesUI();
                          });

                          row.addView(keyTv);
                          row.addView(delTv);
                          recentListContainer.addView(row);
                      }
                  } catch (Exception e) {
                      recentSection.setVisibility(View.GONE);
                  }
              }

              private void pasteFromClipboard() {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip() && cm.getPrimaryClip() != null && cm.getPrimaryClip().getItemCount() > 0) {
                      CharSequence text = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      if (text != null && !text.toString().trim().isEmpty()) {
                          licenseInput.setText(text.toString().trim());
                          return;
                      }
                  }
                  Toast.makeText(this, "کلیپ‌بورد خالی است", Toast.LENGTH_SHORT).show();
              }

              private void showLoginStatus(String msg, String colorHex) {
                  loginStatusView.setText(msg);
                  loginStatusView.setTextColor(Color.parseColor(colorHex));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(COLOR_BG));
                  bg.setCornerRadius(dp(10));
                  bg.setStroke(dp(1), Color.parseColor(colorHex));
                  loginStatusView.setBackground(bg);
                  loginStatusView.setVisibility(View.VISIBLE);
              }

              private Button createMainButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(14));
                  if (strokeHex != null) bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  btn.setBackground(bg);
                  return btn;
              }

              private Button createPillButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(8));
                  if (strokeHex != null) bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  btn.setBackground(bg);
                  btn.setPadding(dp(8), dp(4), dp(8), dp(4));
                  btn.setMinHeight(0);
                  btn.setMinimumHeight(0);
                  btn.setMinWidth(0);
                  btn.setMinimumWidth(0);
                  return btn;
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          value,
                          getResources().getDisplayMetrics()
                  );
              }

              private void requestLocationPermissionsIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 1002);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (isPortalVisible) {
                      if (webView != null && webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          confirmAndResetSession();
                      }
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tapsi-Link-Client-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Link-Client-APK
          path: Tapsi-Link-Client-v1.0.apk

      - name: Create GitHub Release (Optional Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Tapsi Link Client APK (Build #${{ github.run_number }})"
          files: Tapsi-Link-Client-v1.0.apk
